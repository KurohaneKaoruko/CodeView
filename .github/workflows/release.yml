name: Release

# 推送 v* 标签或在 Actions 页手动触发
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: '0.1.0'
  # tag 推送时 ref_name 即标签名（如 v0.1.0）；手动触发时回退 v0.1.0
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || 'v0.1.0' }}
jobs:
  # ---------- CLI（codeview 命令，全平台） ----------
  cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64
            ext: .exe
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64
            ext: ''
          - os: macos-13
            target: x86_64-apple-darwin
            platform: macos-x64
            ext: ''
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
            ext: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}

      - name: Build CLI (release)
        run: cargo build --release -p codeview-server --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          NAME="CodeView-${APP_VERSION}-${{ matrix.platform }}"
          mkdir -p "dist/$NAME"
          cp "target/${{ matrix.target }}/release/codeview${{ matrix.ext }}" "dist/$NAME/"
          cp README.md "dist/$NAME/" || true
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a "$NAME.zip" "./dist/$NAME/*" >/dev/null
          else
            tar -czf "$NAME.tar.gz" -C dist "$NAME"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.platform }}
          path: |
            CodeView-*.zip
            CodeView-*.tar.gz
          if-no-files-found: error

  # ---------- 桌面应用（Tauri 打包：nsis / dmg / appimage / deb） ----------
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            platform: macos-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps (Tauri)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libfuse2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.target }}

      - name: Build & upload desktop bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/desktop
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'CodeView ${{ env.RELEASE_TAG }}'
          releaseBody: 'CodeView 轻量项目代码查看器。各平台安装包与独立可执行文件见下方 Assets。'
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

  # ---------- CLI 归档上传到同一 Release ----------
  upload-cli:
    needs: [cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload CLI archives to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            **/CodeView-*.zip
            **/CodeView-*.tar.gz
